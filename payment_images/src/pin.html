<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif}
  html,body{width:1080px;height:1080px;overflow:hidden}
  .frame{width:1080px;height:1080px;background:#1B4DFF;color:#fff;
    display:flex;flex-direction:column;padding:110px 96px}
  .logo{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1}
  .tagline{font-size:32px;font-weight:600;color:rgba(255,255,255,.80);margin-top:18px}
  .spacer{flex:1}
  .title{font-size:188px;font-weight:900;letter-spacing:-8px;line-height:.96}
  .add{display:inline-block;margin-top:34px;font-size:62px;font-weight:800;letter-spacing:-2px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.30);
    padding:18px 38px;border-radius:999px}
  .price{margin-top:40px;font-size:104px;font-weight:900;letter-spacing:-3px}
  .price .vat{font-size:40px;font-weight:600;color:rgba(255,255,255,.78);margin-left:18px;letter-spacing:0}
</style></head><body>
<div class="frame">
  <div class="logo">청년정보</div>
  <div class="tagline">오픈채팅방 광고</div>
  <div class="spacer"></div>
  <div class="title">게시 1회</div>
  <div class="add">＋ 공지 고정 24시간</div>
  <div class="price">100,000원<span class="vat">VAT 별도</span></div>
</div></body></html>
