<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif}
  html,body{width:1080px;height:1080px;overflow:hidden}
  .frame{width:1080px;height:1080px;position:relative;
    background:radial-gradient(1200px 700px at 78% -12%,#2B6FE0 0%,#15407F 45%,#0C2A5C 100%);
    color:#fff;display:flex;flex-direction:column;justify-content:center;padding:96px 92px}
  .bubble{position:absolute;border-radius:42px 42px 42px 8px;background:rgba(255,255,255,.06)}
  .b1{width:300px;height:170px;top:90px;right:-40px;transform:rotate(8deg)}
  .b2{width:200px;height:120px;bottom:120px;left:-30px;border-radius:8px 42px 42px 42px;transform:rotate(-6deg)}
  .badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);padding:14px 26px;border-radius:999px;
    font-size:30px;font-weight:700;width:fit-content;backdrop-filter:blur(4px)}
  .title{font-size:118px;font-weight:800;line-height:1.04;margin:42px 0 14px;letter-spacing:-3px}
  .sub{font-size:38px;font-weight:600;color:#BFD4F5}
  .price{display:flex;align-items:flex-end;gap:18px;margin:54px 0 8px}
  .price .num{font-size:128px;font-weight:800;color:#FFC34D;letter-spacing:-4px;line-height:.9}
  .price .won{font-size:54px;font-weight:800;color:#FFC34D;padding-bottom:14px}
  .vat{font-size:30px;font-weight:600;color:#9FB8E0;padding-bottom:22px}
  .room{margin-top:46px;display:flex;align-items:center;gap:14px;font-size:33px;font-weight:600;color:#E6EEFB}
  .dot{width:12px;height:12px;border-radius:50%;background:#42E29B;box-shadow:0 0 0 6px rgba(66,226,155,.25)}
  .feats{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}
  .chip{font-size:29px;font-weight:700;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);
    padding:16px 26px;border-radius:18px}
  .chip b{color:#FFC34D}
</style></head><body>
<div class="frame">
  <div class="bubble b1"></div><div class="bubble b2"></div>
  <div class="badge">📢 고방 오픈카톡방 광고</div>
  <div class="title">게시 1회</div>
  <div class="sub">스폰서 게시 · [광고] 표기 업로드</div>
  <div class="price"><span class="num">55,000</span><span class="won">원</span><span class="vat">VAT 포함</span></div>
  <div class="room"><span class="dot"></span>청년 주거·주택·자금 정보방 · 멤버 <b style="color:#fff;margin-left:6px">1,178명</b></div>
  <div class="feats">
    <div class="chip">✓ 다음날 <b>자정까지</b> 유지</div>
    <div class="chip">✓ 문구·이미지 <b>사전 검수</b></div>
  </div>
</div></body></html>
