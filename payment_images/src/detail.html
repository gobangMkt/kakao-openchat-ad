<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif}
  html,body{width:1080px;height:1350px;overflow:hidden}
  .frame{width:1080px;height:1350px;background:#1B4DFF;color:#fff;display:flex;flex-direction:column;padding:120px 96px}
  .logo{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1}
  .tagline{font-size:32px;font-weight:600;color:rgba(255,255,255,.80);margin-top:18px}
  .lead{margin-top:96px;font-size:84px;font-weight:900;letter-spacing:-4px;line-height:1.12}
  .lead b{color:#fff}
  .members{margin-top:36px;font-size:44px;font-weight:700;color:rgba(255,255,255,.92)}
  .card{margin-top:auto;background:#fff;color:#15233D;border-radius:30px;padding:48px 52px}
  .row{display:flex;justify-content:space-between;align-items:center}
  .row + .row{margin-top:30px;padding-top:30px;border-top:1px solid #EEF1F7}
  .row .name{font-size:42px;font-weight:800}
  .row .p{font-size:52px;font-weight:900;color:#1B4DFF;letter-spacing:-2px}
  .note{margin-top:40px;font-size:34px;font-weight:600;color:rgba(255,255,255,.88)}
</style></head><body>
<div class="frame">
  <div class="logo">청년정보</div>
  <div class="tagline">오픈채팅방 광고</div>
  <div class="lead">청년 주거 정보방에<br>광고를 노출하세요</div>
  <div class="members">청년 주거·주택 실수요 타깃이 모인 정보방</div>
  <div class="card">
    <div class="row"><span class="name">게시 1회</span><span class="p">55,000원</span></div>
    <div class="row"><span class="name">게시 1회 + 공지 고정 24h</span><span class="p">110,000원</span></div>
  </div>
  <div class="note">[광고] 표기 · 문구·이미지 사전 검수 후 게시</div>
</div></body></html>
